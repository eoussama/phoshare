# The landing page, on GitHub Pages, whenever it or the screenshots change on master. The page and its screenshots live
# in docs/; the logo is copied in from the app's resources so there's only one copy of it in the repository, and
# PRIVACY.md is rendered into private.html, served as /private (the privacy policy URL on Google Play). The trailer
# that the page plays comes from branding/trailer/.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "app/src/main/res/drawable-nodpi/logo.png"
      - "PRIVACY.md"
      - "branding/trailer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          cp -r docs _site
          cp app/src/main/res/drawable-nodpi/logo.png _site/logo.png
          mkdir -p _site/media
          cp branding/trailer/phoshare-trailer.mp4 _site/media/
          npx --yes marked@18.1.1 -i PRIVACY.md -o privacy.fragment.html
          node -e '
            const fs = require("fs");
            const page = fs.readFileSync("_site/private.html", "utf8");
            if (!page.includes("<!-- PRIVACY.md -->")) throw new Error("private.html lost its placeholder");
            fs.writeFileSync("_site/private.html", page.replace("<!-- PRIVACY.md -->", () => fs.readFileSync("privacy.fragment.html", "utf8")));
          '

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
